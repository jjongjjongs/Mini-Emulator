plugins {
    id 'com.android.application'
}

// A tiny APK that only proves to Android developer verification that whoever holds the
// release key owns com.example.minigba.gbaonly: same package, same key, and the console's
// identifier in assets/adi-registration.properties. Not for installing.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.example.minigba.ownership'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.minigba.gbaonly'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // Every scheme, for whatever the console reads.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
