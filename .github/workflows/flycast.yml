name: Build Dreamcast core

# Flycast (Dreamcast) takes far longer to build than the rest of the app, so
# it is built here and kept in the Actions cache; the APK build only restores it.
# Run this (or push a change to the script) before a release that needs a new core.

on:
  push:
    branches: ['**']
    paths:
      - cores/build-flycast.sh
      - cores/patches/flycast-*.patch
      - .github/workflows/flycast.yml
  workflow_dispatch:

jobs:
  flycast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore Dreamcast core
        id: flycast-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libflycast_libretro_android.so
          key: flycast-${{ hashFiles('cores/build-flycast.sh', 'cores/patches/flycast-*.patch') }}

      - name: Install build tools
        if: steps.flycast-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          df -h .

      - name: Build Dreamcast core
        if: steps.flycast-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./cores/build-flycast.sh

      - name: Save Dreamcast core
        if: steps.flycast-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libflycast_libretro_android.so
          key: flycast-${{ hashFiles('cores/build-flycast.sh', 'cores/patches/flycast-*.patch') }}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flycast-logs
          path: cores/build/*.log
