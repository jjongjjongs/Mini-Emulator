name: PS3 engine probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List ARMSX3 releases and inspect the newest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api repos/ARMSX2/ARMSX3/releases?per_page=5 --jq '.[] | "\(.tag_name) \(.published_at) \(.target_commitish) | \([.assets[] | "\(.name)=\(.size)"] | join(" "))"'
          TAG=$(gh api repos/ARMSX2/ARMSX3/releases?per_page=1 --jq '.[0].tag_name')
          gh api repos/ARMSX2/ARMSX3/git/ref/tags/$TAG --jq '.object' || true
          mkdir rel && cd rel
          gh release download "$TAG" -R ARMSX2/ARMSX3 -p '*.apk' || true
          ls -la
          for apk in *.apk; do
            sha256sum "$apk"
            unzip -l "$apk" | grep -E "lib/|\.so" | head -60
            unzip -o -q "$apk" 'lib/arm64-v8a/*' -d "x-$apk" || true
            for so in x-"$apk"/lib/arm64-v8a/*.so; do
              echo "== $so"; sha256sum "$so"; readelf -d "$so" | grep -E "NEEDED|SONAME" || true
            done
            readelf -Ws --dyn-syms x-"$apk"/lib/arm64-v8a/libarmsx3-core.so 2>/dev/null | grep -E " _rpcsx_| JNI_" | awk '{print $8}' | sort | head -150 || true
          done
