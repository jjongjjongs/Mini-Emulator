name: Build GameCube and Wii core

# Dolphin (GameCube and Wii) takes far longer to build than the rest of the app, so
# it is built here and kept in the Actions cache; the APK build only restores it.
# Run this (or push a change to the script) before a release that needs a new core.

on:
  push:
    branches: ['**']
    paths:
      - cores/build-dolphin.sh
      - cores/patches/dolphin-*.patch
      - .github/workflows/dolphin.yml
  workflow_dispatch:

jobs:
  dolphin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore GameCube and Wii core
        id: dolphin-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libdolphin_libretro_android.so
            app/src/main/assets/dolphin_sys.zip
          key: dolphin-${{ hashFiles('cores/build-dolphin.sh', 'cores/patches/dolphin-*.patch') }}

      - name: Install build tools
        if: steps.dolphin-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
          df -h .

      - name: Build GameCube and Wii core
        if: steps.dolphin-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./cores/build-dolphin.sh

      - name: Save GameCube and Wii core
        if: steps.dolphin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libdolphin_libretro_android.so
            app/src/main/assets/dolphin_sys.zip
          key: dolphin-${{ hashFiles('cores/build-dolphin.sh', 'cores/patches/dolphin-*.patch') }}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-logs
          path: cores/build/*.log
