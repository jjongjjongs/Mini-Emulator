name: Build Nintendo 64 core

# Mupen64Plus-Next (Nintendo 64) takes far longer to build than the rest of the app, so
# it is built here and kept in the Actions cache; the APK build only restores it.
# Run this (or push a change to the script) before a release that needs a new core.

on:
  push:
    branches: ['**']
    paths:
      - cores/build-mupen64.sh
      - cores/patches/mupen64-*.patch
      - .github/workflows/mupen64.yml
  workflow_dispatch:

jobs:
  mupen64:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore Nintendo 64 core
        id: mupen64-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libmupen64plus_next_libretro_android.so
          key: mupen64-${{ hashFiles('cores/build-mupen64.sh', 'cores/patches/mupen64-*.patch') }}

      - name: Install build tools
        if: steps.mupen64-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          df -h .

      - name: Build Nintendo 64 core
        if: steps.mupen64-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./cores/build-mupen64.sh

      - name: Save Nintendo 64 core
        if: steps.mupen64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libmupen64plus_next_libretro_android.so
          key: mupen64-${{ hashFiles('cores/build-mupen64.sh', 'cores/patches/mupen64-*.patch') }}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mupen64-logs
          path: cores/build/*.log
