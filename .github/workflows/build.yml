name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Native bridge host test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lld llvm > /dev/null
          ./native-test/run.sh

      # Release signing needs these repository secrets:
      #   KEYSTORE_BASE64  base64 of minigba-release.jks
      #   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Release tags need the keystore secrets"
              exit 1
            fi
            echo "Keystore secrets not set; skipping the release build"
            exit 0
          fi
          mkdir -p release
          echo "$KEYSTORE_BASE64" | base64 -d > release/minigba-release.jks
          {
            echo "storeFile=release/minigba-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew --no-daemon assembleRelease
          rm -f keystore.properties release/minigba-release.jks

      # Updates only install over the existing app when signed by the same key.
      - name: Check release signing certificate
        env:
          EXPECTED_CERT_SHA256: 9ee14763d21fbb7c085a1e92e487255a1a5e89260259c7812ded52d28535e8e4
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            echo "No release APK"
            exit 0
          fi
          certs=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")
          echo "$certs"
          echo "$certs" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" || {
            echo "::error::Release APK is not signed with the original MiniGBA key"
            exit 1
          }

      - name: Name APKs
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MiniGBA-$version-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MiniGBA-$version.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: MiniGBA-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniGBA-*.apk
